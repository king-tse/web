<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tse Station - Live TV Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dplayer/dist/DPlayer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --text-color: #f8fafc;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .dashboard {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .dashboard { grid-template-columns: 1fr; }
    }

    .main-player-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    #dplayer { width: 100%; aspect-ratio: 16/9; }

    .control-panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-row { display: flex; gap: 8px; }

    input, select {
      flex: 1;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent-color); }

    button {
      padding: 10px 16px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    button:hover { background: #2563eb; }

    .preset-section {
      margin-top: 5px;
      padding-top: 15px;
      border-top: 1px dashed var(--border-color);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .side-panel {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      max-height: 720px;
    }

    .panel-header {
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 15px;
    }

    .filter-tools { display: flex; gap: 8px; }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .channel-item {
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 6px;
      border-left: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .channel-item-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-item:hover { background: #1e293b; border-left-color: #64748b; }
    .channel-item.active { border-left-color: var(--accent-color); background: #1e293b; font-weight: bold; }

    .channel-name { font-size: 13px; word-break: break-all; }
    .channel-group-tag { font-size: 10px; background: #334155; padding: 2px 6px; border-radius: 4px; color: #cbd5e1; }
    
    .channel-epg-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
    }

    .channel-epg-text {
      font-size: 11px;
      color: #38bdf8;
      font-weight: normal;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }

    .epg-btn {
      font-size: 10px;
      padding: 2px 6px;
      background: #334155;
      color: #38bdf8;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    .epg-btn:hover { background: #0284c7; color: #fff; }

    /* EPG 节目单弹窗 Modal 样式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 30px rgba(0,0,0,0.6);
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 { font-size: 16px; color: #fff; }

    .modal-close {
      background: transparent;
      color: #94a3b8;
      font-size: 20px;
      padding: 0;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .epg-schedule-item {
      display: flex;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #0f172a;
      font-size: 13px;
      align-items: center;
    }

    .epg-schedule-item.now-playing {
      background: #1e3a8a;
      border-left: 3px solid #3b82f6;
    }

    .epg-time {
      color: #94a3b8;
      font-size: 12px;
      font-family: monospace;
      white-space: nowrap;
    }

    .epg-title {
      color: #f8fafc;
      flex: 1;
    }

    .epg-tag {
      font-size: 10px;
      background: #2563eb;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<script>
  let dp = null;
  let hlsInstance = null; // 保存 HLS 实例引用，避免音频残留
  let allChannels = [];
  let filteredChannels = [];
  let rawEpgProgrammes = [];

  // 清洗频道名称/ID的辅助函数：移除分辨率标记、特殊字符并统转小写
  function cleanChannelName(str) {
    if (!str) return '';
    return str
      .toLowerCase()
      .replace(/\(.*?\)|\[.*?\]|「.*?」/g, '') // 自动清洗 (1080p)、[720p] 等后缀
      .replace(/[^a-z0-9\u4e00-\u9fa5]/g, '');  // 仅保留基础字符进行智能比对
  }

  function playUrl(url) {
    // 1. 彻底销毁上一个播放器实例
    if (dp) {
      try {
        dp.pause();
        dp.destroy();
      } catch (e) {}
      dp = null;
    }

    // 2. 彻底销毁并停止上一个 HLS 流解密/下载（解决残留声音的关键）
    if (hlsInstance) {
      try {
        hlsInstance.stopLoad();
        hlsInstance.detachMedia();
        hlsInstance.destroy();
      } catch (e) {}
      hlsInstance = null;
    }

    // 3. 重新创建播放器
    dp = new DPlayer({
      container: document.getElementById('dplayer'),
      live: true,
      autoplay: true,
      theme: '#3b82f6',
      video: {
        url: url,
        type: 'customHls',
        customType: {
          customHls: function (video) {
            hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
            hlsInstance.loadSource(video.src);
            hlsInstance.attachMedia(video);
          }
        }
      }
    });

    dp.on('error', function() {
      document.getElementById('currentStatus').innerText = "播放报错/跨域限制";
      document.getElementById('currentStatus').style.color = "#ef4444";
    });

    dp.on('playing', function() {
      document.getElementById('currentStatus').innerText = "播放中";
      document.getElementById('currentStatus').style.color = "#10b981";
    });
  }

  function applyPresetSource(url) {
    if (!url) return;
    document.getElementById('streamUrl').value = url;
    handleStreamInput();
  }

  function applyPresetEPG(url) {
    if (!url) return;
    document.getElementById('epgUrl').value = url;
    loadEPG();
  }

  async function handleStreamInput() {
    const url = document.getElementById('streamUrl').value.trim();
    if (!url) return alert('请输入地址！');

    if (url.includes('.m3u') && !url.includes('.m3u8')) {
      await fetchM3uPlaylist(url);
    } else {
      playUrl(url);
    }
  }

  async function fetchM3uPlaylist(url) {
    document.getElementById('currentStatus').innerText = "获取列表中...";
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("无法读取文件");
      const text = await res.text();
      
      parseM3u(text);
      document.getElementById('currentStatus').innerText = "解析成功";
      loadEPG();
    } catch (e) {
      document.getElementById('currentStatus').innerText = "加载失败";
      document.getElementById('currentStatus').style.color = "#ef4444";
    }
  }

  function parseM3u(data) {
    const lines = data.split('\n');
    allChannels = [];
    const groups = new Set();

    let currentName = '';
    let currentGroup = '未分类';
    let currentTvgId = '';

    lines.forEach(line => {
      line = line.trim();
      if (line.startsWith('#EXTINF:')) {
        const groupMatch = line.match(/group-title="([^"]+)"/i);
        currentGroup = groupMatch ? groupMatch[1] : '未分类';
        groups.add(currentGroup);

        const idMatch = line.match(/tvg-id="([^"]+)"/i);
        currentTvgId = idMatch ? idMatch[1] : '';

        const parts = line.split(',');
        currentName = parts[parts.length - 1] || '未知频道';
        currentName = currentName.replace(/\s*「.*?」/g, '').trim(); 
      } else if (line.startsWith('http')) {
        if (currentName) {
          allChannels.push({ name: currentName, group: currentGroup, tvgId: currentTvgId, url: line });
          currentName = '';
        }
      }
    });

    updateGroupDropdown(Array.from(groups));
    filterChannels();

    if (allChannels.length > 0) {
      selectChannel(0);
    }
  }

  function updateGroupDropdown(groups) {
    const select = document.getElementById('groupSelect');
    select.innerHTML = '<option value="ALL">全部分类 (All Groups)</option>';
    
    groups.sort().forEach(group => {
      const option = document.createElement('option');
      option.value = group;
      option.innerText = group;
      select.appendChild(option);
    });
  }

  function filterChannels() {
    const selectedGroup = document.getElementById('groupSelect').value;
    const keyword = document.getElementById('searchBox').value.toLowerCase().trim();

    filteredChannels = allChannels.filter(ch => {
      const matchGroup = (selectedGroup === 'ALL' || ch.group === selectedGroup);
      const matchKey = ch.name.toLowerCase().includes(keyword);
      return matchGroup && matchKey;
    });

    renderChannelList();
  }

  function renderChannelList() {
    const container = document.getElementById('channelContainer');
    document.getElementById('channelCount').innerText = filteredChannels.length;
    container.innerHTML = '';

    if (filteredChannels.length === 0) {
      container.innerHTML = `<div style="color: #64748b; font-size: 13px; text-align: center; padding-top: 20px;">未匹配到任何频道</div>`;
      return;
    }

    filteredChannels.forEach((ch, index) => {
      const div = document.createElement('div');
      div.className = 'channel-item';
      div.id = `ch-${index}`;
      
      const currentProgram = getCurrentProgramme(ch);
      const epgText = currentProgram ? `▶ ${currentProgram.title}` : '暂无节目表';

      div.innerHTML = `
        <div class="channel-item-main">
          <span class="channel-name">${ch.name}</span>
          <span class="channel-group-tag">${ch.group}</span>
        </div>
        <div class="channel-epg-row">
          <span class="channel-epg-text">${epgText}</span>
          <button class="epg-btn" onclick="openEpgModal(event, ${index})">📅 节目单</button>
        </div>
      `;
      div.onclick = (e) => {
        if(!e.target.classList.contains('epg-btn')) selectChannel(index);
      };
      container.appendChild(div);
    });
  }

  function selectChannel(index) {
    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
    const activeEl = document.getElementById(`ch-${index}`);
    if (activeEl) activeEl.classList.add('active');

    playUrl(filteredChannels[index].url);
  }

  async function loadEPG() {
    const epgUrl = document.getElementById('epgUrl').value.trim();
    if (!epgUrl) return;

    document.getElementById('currentStatus').innerText = "加载 EPG 中...";
    try {
      const response = await fetch(epgUrl);
      if (!response.ok) throw new Error('网络请求失败');

      let xmlText = '';
      if (epgUrl.endsWith('.gz')) {
        const arrayBuffer = await response.arrayBuffer();
        const decompressed = pako.inflate(new Uint8Array(arrayBuffer), { to: 'string' });
        xmlText = decompressed;
      } else {
        xmlText = await response.text();
      }

      parseXMLTV(xmlText);
      document.getElementById('currentStatus').innerText = "EPG 匹配成功";
      document.getElementById('currentStatus').style.color = "#10b981";
    } catch (e) {
      document.getElementById('currentStatus').innerText = "EPG 匹配失败";
      document.getElementById('currentStatus').style.color = "#ef4444";
    }
  }

  function parseXMLTV(xmlString) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlString, "text/xml");
    const programmes = xmlDoc.getElementsByTagName("programme");

    rawEpgProgrammes = [];

    for (let prog of programmes) {
      const channel = prog.getAttribute("channel");
      const startStr = prog.getAttribute("start");
      const stopStr = prog.getAttribute("stop");
      const title = prog.getElementsByTagName("title")[0]?.textContent || '';

      if (channel && title && startStr) {
        rawEpgProgrammes.push({
          channel: channel,
          start: parseXmltvTime(startStr),
          stop: parseXmltvTime(stopStr),
          title: title
        });
      }
    }

    renderChannelList();
  }

  function parseXmltvTime(timeStr) {
    if (!timeStr || timeStr.length < 14) return new Date(0);
    const Y = timeStr.substr(0, 4);
    const M = timeStr.substr(4, 2) - 1;
    const D = timeStr.substr(6, 2);
    const h = timeStr.substr(8, 2);
    const m = timeStr.substr(10, 2);
    const s = timeStr.substr(12, 2);
    return new Date(Date.UTC(Y, M, D, h - 8, m, s));
  }

  function getCurrentProgramme(ch) {
    if (!rawEpgProgrammes || rawEpgProgrammes.length === 0) return null;

    const now = new Date();
    const chNameClean = cleanChannelName(ch.name);
    const tvgIdClean = cleanChannelName(ch.tvgId);

    return rawEpgProgrammes.find(p => {
      const epgChanClean = cleanChannelName(p.channel);
      
      const isMatch = (tvgIdClean && epgChanClean === tvgIdClean) ||
                      (epgChanClean === chNameClean) ||
                      (chNameClean.length > 3 && epgChanClean.includes(chNameClean));

      return isMatch && (now >= p.start && now <= p.stop);
    });
  }

  function openEpgModal(event, index) {
    event.stopPropagation();
    const ch = filteredChannels[index];
    const chNameClean = cleanChannelName(ch.name);
    const tvgIdClean = cleanChannelName(ch.tvgId);
    const now = new Date();

    const channelProgs = rawEpgProgrammes.filter(p => {
      const epgChanClean = cleanChannelName(p.channel);
      return (tvgIdClean && epgChanClean === tvgIdClean) ||
             (epgChanClean === chNameClean) ||
             (chNameClean.length > 3 && epgChanClean.includes(chNameClean));
    });

    document.getElementById('modalChannelTitle').innerText = `📺 ${ch.name} - 节目单`;
    const container = document.getElementById('modalEpgList');
    container.innerHTML = '';

    if (channelProgs.length === 0) {
      container.innerHTML = '<div style="color: #64748b; text-align: center; padding: 20px;">未匹配到该频道的 EPG 信息</div>';
    } else {
      channelProgs.forEach(p => {
        const isNow = (now >= p.start && now <= p.stop);
        const startTime = p.start.toTimeString().substr(0, 5);
        const stopTime = p.stop.toTimeString().substr(0, 5);

        const div = document.createElement('div');
        div.className = `epg-schedule-item ${isNow ? 'now-playing' : ''}`;
        div.innerHTML = `
          <span class="epg-time">${startTime} - ${stopTime}</span>
          <span class="epg-title">${p.title}</span>
          ${isNow ? '<span class="epg-tag">正在播出</span>' : ''}
        `;
        container.appendChild(div);
      });
    }

    document.getElementById('epgModal').classList.add('active');
  }

  function closeEpgModal() {
    document.getElementById('epgModal').classList.remove('active');
  }

  // 点击半透明背景空白处关闭弹窗
  document.getElementById('epgModal').addEventListener('click', function(e) {
    if (e.target === this) {
      closeEpgModal();
    }
  });

  // 按 Esc 键关闭弹窗
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      closeEpgModal();
    }
  });
</script>

</body>
