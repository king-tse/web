<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 1. 添加移动端视口设置，解决手机端缩放问题 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Radio Player  -KingTse</title>
  <style>
    /* 1. 页面整体 Flex 布局让整体上下左右看起来更舒适 */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      padding: 40px 20px; 
      background: #121212; 
      color: #fff; 
      margin: 0;
    }

    /* 2. 主容器：限制最大宽度为 900px，并水平居中，使用网格实现两列布局 */
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start; /* 避免卡片高度拉伸不一致 */
    }

    /* 让标题跨越两列 */
    h2 {
      grid-column: 1 / -1;
      text-align: center;
      margin-bottom: 5px; /* 原有margin-bottom:25px，调整为5px以配合网格间距 */
      letter-spacing: 1px;
    }

    /* 3. 电台卡片基础样式：缩小尺寸并增加精致感 */
    .player-box { 
      margin-bottom: 0; /* 原有margin-bottom:20px，由grid gap统一控制间距 */
      padding: 20px; 
      background: #1e1e1e; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    h3 { 
      margin-top: 0; 
      margin-bottom: 12px;
      font-size: 18px;
    }

    /* 让音频播放控件拉满卡片宽度 */
    audio { 
      width: 100%; 
      display: block;
      outline: none;
    }

    /* 4. BBC Radio 专属卡片样式补全 */
    .card {
      background: #1e1e1e;
      padding: 20px;
      margin-bottom: 0; /* 原有margin-bottom:20px，由grid gap统一控制间距 */
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
      box-sizing: border-box;
    }
    .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 6px;
      color: #ff0055;
    }
    .subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px 0;
      background-color: #ff0055;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .btn:hover {
      background-color: #e0004c;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 0, 85, 0.4);
    }

    /* 移动端适配：当屏幕宽度小于 640px 时，恢复为单列 */
    @media (max-width: 640px) {
      .container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Live Radio Player</h2>

    <!-- Capital FM -->
    <div class="player-box">
      <h3>Capital FM UK (London)</h3>
      <audio controls preload="none">
        <source src="http://media-ice.musicradio.com/CapitalMP3" type="audio/mpeg">
        你的浏览器不支持 audio 标签。
      </audio>
    </div>

    <!-- Z100 New York -->
    <div class="player-box">
      <h3>Z100 New York (WHTZ)</h3>
      <audio controls preload="none">
        <source src="https://radio.garden/api/ara/content/listen/XSj1uCXy/channel.mp3" type="audio/mpeg">
        你的浏览器不支持 audio 标签。
      </audio>
    </div>

    <!-- KEXP 90.3 FM -->
    <div class="player-box">
      <h3>KEXP 90.3 FM</h3>
      <audio controls preload="none">
        <source src="https://kexp.streamguys1.com/kexp160.aac" type="audio/mpeg">
        你的浏览器不支持 audio 标签。
       <!-- 标准 128k MP3 流：https://kexp-mp3-128.streamguys1.com/kexp128.mp3 -->
       <!-- 高清 160k AAC 流（当前使用）：https://kexp.streamguys1.com/kexp160.aac -->
      </audio>
    </div>

    <!-- SomaFM: Indie Pop Rocks! -->
    <div class="player-box">
      <h3>SomaFM: Indie Pop Rocks!</h3>
      <audio controls preload="none">
        <source src="https://ice2.somafm.com/indiepop-128-aac" type="audio/mpeg">
        你的浏览器不支持 audio 标签。
      </audio>
    </div>

    <!-- SomaFM: Groove Salad -->
    <div class="player-box">
      <h3>SomaFM: Groove Salad</h3>
      <audio controls preload="none">
        <source src="https://ice2.somafm.com/groovesalad-128-mp3" type="audio/mpeg">
        你的浏览器不支持 audio 标签。
      </audio>
    </div>

    <!-- 上海经典947 -->
    <div class="player-box">
      <h3>上海经典947</h3>
      <audio controls preload="none">
        <source src="https://lhttp.qingting.fm/live/267/64k.mp3" type="audio/mpeg">
        你的浏览器不支持 audio 标签。
      </audio>
    </div>

    <!-- BBC Radio 1 -->
    <div class="card">
      <div class="logo">BBC RADIO 1</div>
      <div class="subtitle">Live Radio Stream</div>
      <a href="https://www.bbc.co.uk/sounds/play/live/bbc_radio_one" target="_blank" class="btn">
        ▶ 收听 BBC Radio 1
      </a>
    </div>

    <!-- BBC Radio 6 -->
    <div class="card">
      <div class="logo">BBC RADIO 6</div>
      <div class="subtitle">Live Radio Stream</div>
      <a href="https://www.bbc.co.uk/sounds/play/live/bbc_6music" target="_blank" class="btn">
        ▶ 收听 BBC Radio 6
      </a>
    </div>
  </div>

  <script>
// 1. 监听 play 事件：播放当前电台时，强行暂停并断开其他所有电台
document.addEventListener('play', function(e) {
  if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'audio') {
    var audios = document.getElementsByTagName('audio');
    for (var i = 0; i < audios.length; i++) {
      if (audios[i] !== e.target) {
        audios[i].pause();
        audios[i].load(); // 切断其他播放器的网络连接
      }
    }
  }
}, true);

// 2. 监听 pause 事件：单个电台主动点击暂停时，也立刻执行 load() 切断流量
document.addEventListener('pause', function(e) {
  if (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'audio') {
    e.target.load(); // 当手动点击暂停时，强行重置并切断后台直播流连接
  }
}, true);
  </script>

</body>
</html>
